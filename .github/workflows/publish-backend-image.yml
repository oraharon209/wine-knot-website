name: Publish backend image

# Build and push wine-knot-backend to GHCR (always) and Docker Hub (when token present).
# Use this to verify the pipeline without waiting for the weekly sync.
on:
  workflow_dispatch:
    inputs:
      push_dockerhub:
        description: Also push to Docker Hub when DOCKERHUB_TOKEN is set
        type: boolean
        default: true
  workflow_call:
    inputs:
      ref:
        description: Git ref to build; defaults to the ref that called this workflow
        required: false
        type: string
        default: ''
    outputs:
      tag:
        description: >-
          Tag pushed to Docker Hub, empty when it was not. Only the tag, because
          the account name is a secret and Actions drops outputs containing one.
        value: ${{ jobs.publish.outputs.tag }}
  push:
    branches:
      - main
      - new
      - cursor/wine-knot-redesign-67b4
    paths:
      - backend/**
      - .github/workflows/publish-backend-image.yml

concurrency:
  group: publish-backend-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      tag: ${{ steps.build.outputs.tag }}
    env:
      # Empty unless another workflow called this one with an explicit ref.
      REF_INPUT: ${{ inputs.ref }}
      # The production deploy job reads the account name from a repo variable,
      # so check that first and keep the secret spellings as fallbacks.
      DOCKERHUB_USERNAME_VAR: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Build and push
        id: build
        run: |
          set -euo pipefail
          echo "tag=" >> "$GITHUB_OUTPUT"
          USERNAME="${DOCKERHUB_USERNAME_VAR:-${DOCKERHUB_USERNAME:-${DOCKERHUB_USER:-oraharon}}}"
          OWNER="${{ github.repository_owner }}"
          GHCR_IMAGE="ghcr.io/${OWNER}/wine-knot-backend"
          IMAGE_REPO="${{ vars.DOCKER_IMAGE_BACKEND }}"
          IMAGE_REPO="${IMAGE_REPO%%:*}"
          if [ -z "$IMAGE_REPO" ]; then
            IMAGE_REPO="${USERNAME}/wine-knot-backend"
          fi
          SHA="$(git rev-parse --short HEAD)"
          # The production deploy used to tag with the full SHA; keep it so
          # anything pinned to that form still resolves.
          FULL_SHA="$(git rev-parse HEAD)"
          BUILD_DATE="$(date -u +%Y%m%d)"

          REF_NAME="${REF_INPUT:-$GITHUB_REF_NAME}"
          # Branch names carry slashes and case; tags allow neither.
          BRANCH_TAG="$(printf '%s' "$REF_NAME" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9._-' '-' | sed 's/^-*//; s/-*$//' | cut -c1-64)"

          # Every build is pinnable by commit and dated; the moving names say
          # where the image is running. Only main may move `latest`, because
          # that is the tag the production server pulls.
          TAGS=("$FULL_SHA" "$SHA" "${BUILD_DATE}-${SHA}")
          [ -n "$BRANCH_TAG" ] && TAGS+=("$BRANCH_TAG")
          case "$REF_NAME" in
            main) TAGS+=("production" "latest") ;;
            new) TAGS+=("staging") ;;
          esac

          docker build -t wine-knot-backend:ci ./backend

          push_all() {
            local repo="$1" t
            for t in "${TAGS[@]}"; do
              docker tag wine-knot-backend:ci "${repo}:${t}"
              docker push "${repo}:${t}"
            done
          }

          TAG_LIST="$(printf '`%s` ' "${TAGS[@]}")"

          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          push_all "$GHCR_IMAGE"
          {
            echo "## Publish backend image"
            echo "- Built from \`${REF_NAME}\` (\`${FULL_SHA}\`)"
            echo "- GHCR: **${GHCR_IMAGE}** — ${TAG_LIST}"
          } >> "$GITHUB_STEP_SUMMARY"

          PUSH_HUB="${{ github.event.inputs.push_dockerhub }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            PUSH_HUB="true"
          fi
          if [ "$PUSH_HUB" = "false" ]; then
            echo "- Docker Hub: skipped by input" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "- Docker Hub: **FAILED** — add Environment secret \`DOCKERHUB_TOKEN\` (username default \`${USERNAME}\`) on GitHub Environment **production**" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::DOCKERHUB_TOKEN is missing on Environment production. GHCR was pushed; Docker Hub was not. Add a Hub access token with push to ${USERNAME}/wine-knot-backend."
            exit 1
          fi

          echo "$DOCKERHUB_TOKEN" | docker login -u "$USERNAME" --password-stdin
          push_all "$IMAGE_REPO"
          echo "tag=${FULL_SHA}" >> "$GITHUB_OUTPUT"
          echo "- Docker Hub: **${IMAGE_REPO}** — ${TAG_LIST}" >> "$GITHUB_STEP_SUMMARY"
