name: Publish backend image

# Build and push wine-knot-backend to GHCR (always) and Docker Hub (when token present).
# Use this to verify the pipeline without waiting for the weekly sync.
on:
  workflow_dispatch:
    inputs:
      push_dockerhub:
        description: Also push to Docker Hub when DOCKERHUB_TOKEN is set
        type: boolean
        default: true
  push:
    branches:
      - main
      - cursor/wine-knot-redesign-67b4
    paths:
      - backend/**
      - .github/workflows/publish-backend-image.yml

concurrency:
  group: publish-backend-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and push
        run: |
          set -euo pipefail
          USERNAME="${DOCKERHUB_USERNAME:-${DOCKERHUB_USER:-oraharon}}"
          OWNER="${{ github.repository_owner }}"
          GHCR_IMAGE="ghcr.io/${OWNER}/wine-knot-backend"
          IMAGE_REPO="${{ vars.DOCKER_IMAGE_BACKEND }}"
          IMAGE_REPO="${IMAGE_REPO%%:*}"
          if [ -z "$IMAGE_REPO" ]; then
            IMAGE_REPO="${USERNAME}/wine-knot-backend"
          fi
          SHA="$(git rev-parse --short HEAD)"
          DATE_TAG="$(date -u +%Y%m%d)"

          docker build -t wine-knot-backend:ci ./backend

          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag wine-knot-backend:ci "${GHCR_IMAGE}:latest"
          docker tag wine-knot-backend:ci "${GHCR_IMAGE}:${SHA}"
          docker tag wine-knot-backend:ci "${GHCR_IMAGE}:${DATE_TAG}"
          docker push "${GHCR_IMAGE}:latest"
          docker push "${GHCR_IMAGE}:${SHA}"
          docker push "${GHCR_IMAGE}:${DATE_TAG}"
          {
            echo "## Publish backend image"
            echo "- GHCR: **${GHCR_IMAGE}:latest** (\`${SHA}\`, \`${DATE_TAG}\`)"
          } >> "$GITHUB_STEP_SUMMARY"

          PUSH_HUB="${{ github.event.inputs.push_dockerhub }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            PUSH_HUB="true"
          fi
          if [ "$PUSH_HUB" = "false" ]; then
            echo "- Docker Hub: skipped by input" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "- Docker Hub: **FAILED** — add Environment secret \`DOCKERHUB_TOKEN\` (username default \`${USERNAME}\`) on GitHub Environment **production**" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::DOCKERHUB_TOKEN is missing on Environment production. GHCR was pushed; Docker Hub was not. Add a Hub access token with push to ${USERNAME}/wine-knot-backend."
            exit 1
          fi

          echo "$DOCKERHUB_TOKEN" | docker login -u "$USERNAME" --password-stdin
          docker tag wine-knot-backend:ci "${IMAGE_REPO}:latest"
          docker tag wine-knot-backend:ci "${IMAGE_REPO}:${SHA}"
          docker tag wine-knot-backend:ci "${IMAGE_REPO}:${DATE_TAG}"
          docker push "${IMAGE_REPO}:latest"
          docker push "${IMAGE_REPO}:${SHA}"
          docker push "${IMAGE_REPO}:${DATE_TAG}"
          echo "- Docker Hub: **${IMAGE_REPO}:latest**" >> "$GITHUB_STEP_SUMMARY"
