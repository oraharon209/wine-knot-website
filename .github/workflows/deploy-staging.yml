name: Deploy staging (new.wineknot.co.il)

# Publishes the redesign to https://new.wineknot.co.il.
# Does not check the production git checkout out of main — apex stays on origin/main.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Git ref whose frontend/public is copied to staging
        required: false
        default: cursor/wine-knot-redesign-67b4
  push:
    branches:
      - cursor/wine-knot-redesign-67b4

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
      STAGING_BRANCH: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.branch || 'cursor/wine-knot-redesign-67b4') || github.ref_name }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish staging via SSM
        run: |
          set -euo pipefail

          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"
          if [ -z "$INSTANCE_ID" ]; then
            echo "EC2_INSTANCE_ID secret is not set"
            exit 1
          fi

          DEPLOY_SCRIPT=$(cat <<'SCRIPT'
          bash -lc 'set -euo pipefail
          APP_DIR=/opt/wine-knot
          STAGING_REF=origin/__STAGING_BRANCH__
          cd "$APP_DIR"
          sudo -u ubuntu git fetch origin
          sudo -u ubuntu git checkout "$STAGING_REF" -- scripts/deploy-staging.sh scripts/ensure_new_subdomain_dns.sh scripts/ensure_staging_admin_access.sh scripts/generate_origin_cert.sh
          chmod +x scripts/deploy-staging.sh scripts/ensure_new_subdomain_dns.sh scripts/ensure_staging_admin_access.sh scripts/generate_origin_cert.sh
          STAGING_REF="$STAGING_REF" bash scripts/deploy-staging.sh'
          SCRIPT
          )
          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__STAGING_BRANCH__/${STAGING_BRANCH}}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions staging ${GITHUB_SHA} (${STAGING_BRANCH})" \
            --parameters "$(jq -n --arg cmd "$DEPLOY_SCRIPT" '{commands: [$cmd]}')" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: $COMMAND_ID"

          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID"
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          echo "Staging deploy timed out waiting for SSM command"
          exit 1
