name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: Git branch to deploy
        required: false
        default: main

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promo-tests:
    name: 12+1 promo tests
    runs-on: ubuntu-latest
    env:
      DEPLOY_BRANCH: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.branch || 'main') || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      - name: Run 12+1 promo tests
        run: node --test scripts/promo.test.js

  # The server pulls DOCKER_IMAGE_BACKEND and only builds locally if the pull
  # fails, so every production deploy has to refresh the registry first.
  publish-image:
    name: Build and push Docker image
    needs: promo-tests
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-backend-image.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.branch || 'main') || github.ref_name }}
    secrets: inherit

  deploy:
    name: Deploy to production
    needs: [promo-tests, publish-image]
    # A registry failure must not strand the site on the old commit — the server
    # falls back to building locally — but failing promo tests must stop here.
    if: always() && needs.promo-tests.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
      DEPLOY_BRANCH: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.branch || 'main') || github.ref_name }}
      BACKEND_IMAGE_TAG: ${{ needs.publish-image.outputs.tag }}
      IMAGE_REPO_VAR: ${{ vars.DOCKER_IMAGE_BACKEND }}
      DOCKERHUB_USERNAME_VAR: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_USERNAME_SECRET: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM
        run: |
          set -euo pipefail

          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"
          if [ -z "$INSTANCE_ID" ]; then
            echo "EC2_INSTANCE_ID secret is not set"
            exit 1
          fi

          # Empty when the publish job failed; the server then builds locally.
          BACKEND_IMAGE=""
          if [ -n "${BACKEND_IMAGE_TAG:-}" ]; then
            IMAGE_REPO="${IMAGE_REPO_VAR%%:*}"
            if [ -z "$IMAGE_REPO" ]; then
              USERNAME="${DOCKERHUB_USERNAME_VAR:-${DOCKERHUB_USERNAME_SECRET:-oraharon}}"
              IMAGE_REPO="${USERNAME}/wine-knot-backend"
            fi
            BACKEND_IMAGE="${IMAGE_REPO}:${BACKEND_IMAGE_TAG}"
          else
            echo "::warning::No image tag from the publish job; the server will build the backend itself."
          fi

          DEPLOY_SCRIPT=$(cat <<'SCRIPT'
          bash -lc 'set -euo pipefail
          APP_DIR=/opt/wine-knot
          BRANCH=__DEPLOY_BRANCH__
          export DOCKER_IMAGE_BACKEND=__BACKEND_IMAGE__
          cd "$APP_DIR"
          sudo -u ubuntu git fetch origin
          sudo -u ubuntu git reset --hard "origin/${BRANCH}"
          bash scripts/deploy.sh'
          SCRIPT
          )
          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__DEPLOY_BRANCH__/${DEPLOY_BRANCH}}"
          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__BACKEND_IMAGE__/${BACKEND_IMAGE}}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions deploy ${GITHUB_SHA} (${DEPLOY_BRANCH})" \
            --parameters "$(jq -n --arg cmd "$DEPLOY_SCRIPT" '{commands: [$cmd]}')" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: $COMMAND_ID"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID"
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          echo "Deploy timed out waiting for SSM command"
          exit 1
