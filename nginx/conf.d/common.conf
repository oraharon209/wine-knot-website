# Local / HTTP: production-shaped host vs staging host on the same port.
server {
    listen 80 default_server;
    server_name wineknot.co.il www.wineknot.co.il _;

    include /etc/nginx/snippets/security-headers.conf;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/app-locations.conf;
}

server {
    listen 80;
    server_name new.wineknot.co.il;

    include /etc/nginx/snippets/security-headers.conf;

    root /usr/share/nginx/html-new;
    index index.html;

    # Bottle photos live with the original storefront.
    location ^~ /images/wines/ {
        root /usr/share/nginx/html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    include /etc/nginx/snippets/app-locations.conf;
}
