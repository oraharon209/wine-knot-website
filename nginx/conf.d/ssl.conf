# Production storefront (git checkout on main).
server {
    listen 443 ssl default_server;
    http2 on;
    server_name wineknot.co.il www.wineknot.co.il;

    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/app-locations.conf;
}

# Redesign staging — populated by scripts/deploy-staging.sh into html-new.
server {
    listen 443 ssl;
    http2 on;
    server_name new.wineknot.co.il;

    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;

    root /usr/share/nginx/html-new;
    index index.html;

    location ^~ /images/wines/ {
        root /usr/share/nginx/html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    include /etc/nginx/snippets/app-locations.conf;
}
