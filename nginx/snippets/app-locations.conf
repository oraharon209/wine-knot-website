location ^~ /images/wines/ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    try_files $uri =404;
}

location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
}

location = /robots.txt {
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.html;
}

location = /api/categories {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://backend:3000/api/categories;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "public, max-age=300";
}

location /api/ {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://backend:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cf-Access-Authenticated-User-Email $http_cf_access_authenticated_user_email;
    proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
}
